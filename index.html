<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>コンサルまさや</title>

<style>
:root {
  --bg: #fff7ec;
  --card: #ffffff;
  --text: #23262b;
  --sub: #6b7280;
  --line: #f0e3d0;
  --black: #111111;
  --green: #0aa66e;
  --orange: #f97316;

  --pop1: #ff4d6d;
  --pop1-dark: #e11d48;
  --pop2: #ffb703;
  --pop3: #06b6d4;
  --pop4: #7c3aed;
  --pop-gradient: linear-gradient(135deg, #ff4d6d 0%, #ff8a3d 55%, #ffc93c 100%);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background:
    radial-gradient(circle at 10% 0%, #ffe9c7 0%, transparent 45%),
    radial-gradient(circle at 90% 10%, #ffd7e0 0%, transparent 40%),
    var(--bg);
  color: var(--text);
  font-family:
    "Hiragino Maru Gothic ProN",
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Noto Sans JP",
    sans-serif;
}

button,
input,
select {
  font-family: inherit;
}

button {
  touch-action: manipulation;
}

.container {
  width: min(720px, 100%);
  margin: auto;
  min-height: 100vh;
}

/* HEADER */

.header {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 14px 18px 14px;
  background: rgba(255,247,236,.92);
  backdrop-filter: blur(18px);
  border-bottom: 3px solid var(--pop2);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 12px;
}

.mascot {
  flex: 0 0 auto;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 3px solid #fff;
  outline: 3px solid var(--pop2);
  box-shadow: 0 6px 14px rgba(225,29,72,.25);
  overflow: hidden;
  background: #ffe9c7;
  animation: mascot-bounce 2.6s ease-in-out infinite;
}

.mascot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 52% 30%;
  transform: scale(2.05);
}

@keyframes mascot-bounce {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-4px) rotate(2deg); }
}

.header-text {
  min-width: 0;
}

.logo {
  font-size: 20px;
  font-weight: 900;
  background: var(--pop-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: .02em;
}

.subtitle {
  margin-top: 2px;
  font-size: 11px;
  color: var(--sub);
  font-weight: 600;
}

.progress {
  margin-top: 14px;
  height: 8px;
  background: #f0e3d0;
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: var(--pop-gradient);
  border-radius: 99px;
  transition: width .3s ease;
}

/* MAIN */

main {
  padding: 18px 15px 50px;
}

.card {
  background: var(--card);
  border-radius: 26px;
  padding: 22px;
  box-shadow: 0 14px 35px rgba(255,77,109,.08);
  border: 2px solid var(--line);
}

h1 {
  margin: 0 0 8px;
  font-size: 25px;
  line-height: 1.35;
  font-weight: 900;
  color: var(--pop1-dark);
}

h2 {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 850;
  color: var(--text);
}

.description {
  margin: 0 0 20px;
  color: var(--sub);
  font-size: 13px;
  line-height: 1.7;
}

/* CHOICES */

.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.choice-grid.three {
  grid-template-columns: repeat(3, 1fr);
}

.choice {
  width: 100%;
  min-height: 66px;
  padding: 14px;
  background: #fffdf8;
  border: 2px solid var(--line);
  border-radius: 18px;
  text-align: left;
  cursor: pointer;
  transition: transform .12s ease, border-color .12s ease, background .12s ease;
}

.choice:active {
  transform: scale(.97);
}

.choice:hover {
  border-color: var(--pop2);
}

.choice.selected {
  border: 2px solid var(--pop1);
  background: linear-gradient(135deg, #fff0f3, #fff8e8);
  box-shadow: 0 4px 12px rgba(255,77,109,.18);
}

.choice-title {
  display: block;
  font-weight: 750;
  font-size: 14px;
}

.choice.selected .choice-title {
  color: var(--pop1-dark);
}

.choice-sub {
  display: block;
  margin-top: 4px;
  color: var(--sub);
  font-size: 11px;
  line-height: 1.5;
}

/* INPUT */

.input-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.input-box {
  min-width: 0;
}

.label {
  display: block;
  margin: 13px 0 7px;
  font-size: 12px;
  font-weight: 750;
}

.data-input {
  display: block !important;
  width: 100% !important;
  height: 54px !important;
  padding: 12px 14px !important;
  border: 1px solid #d1d5db !important;
  border-radius: 14px !important;
  background: #ffffff !important;
  color: #111111 !important;
  font-size: 17px !important;
  line-height: 1.2 !important;
  outline: none !important;
  appearance: none;
  -webkit-appearance: none;
  opacity: 1 !important;
  pointer-events: auto !important;
  position: relative !important;
  z-index: 20 !important;
}

.data-input:focus {
  border: 2px solid #111111 !important;
}

.unit {
  margin-top: 6px;
  color: var(--sub);
  font-size: 11px;
}

/* BUTTONS */

.actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.primary,
.secondary {
  border: 0;
  border-radius: 16px;
  padding: 13px 18px;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .12s ease;
}

.primary:active,
.secondary:active {
  transform: scale(.96);
}

.primary {
  flex: 1;
  background: var(--pop-gradient);
  color: white;
  box-shadow: 0 6px 14px rgba(255,77,109,.3);
}

.secondary {
  background: #fff2e0;
  color: var(--pop1-dark);
  border: 2px solid #ffe2c2;
}

/* TAG */

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 10px 0;
}

.tag {
  padding: 5px 10px;
  background: #fff2e0;
  border-radius: 999px;
  color: var(--pop1-dark);
  font-size: 11px;
  font-weight: 700;
}

/* RESULT */

.result {
  margin-top: 12px;
  padding: 17px;
  border: 2px solid var(--line);
  border-radius: 20px;
}

.result:first-child {
  border: 2.5px solid var(--pop1);
  background: linear-gradient(160deg, #fff8f0, #fff);
  box-shadow: 0 8px 20px rgba(255,77,109,.15);
}

.rank {
  color: var(--sub);
  font-size: 11px;
  font-weight: 800;
}

.plan-name {
  margin-top: 4px;
  font-size: 18px;
  font-weight: 850;
}

.total {
  margin-top: 5px;
  font-size: 29px;
  font-weight: 900;
  color: var(--pop1-dark);
}

.total span {
  color: var(--sub);
  font-size: 11px;
  font-weight: 500;
}

.detail {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px solid var(--line);
  font-size: 12px;
}

.good {
  margin-top: 10px;
  padding: 9px;
  border-radius: 12px;
  background: #ecfdf3;
  color: var(--green);
  font-size: 11px;
  line-height: 1.6;
}

.warning {
  margin-top: 10px;
  padding: 9px;
  border-radius: 12px;
  background: #fff7ed;
  color: #9a3412;
  font-size: 11px;
  line-height: 1.6;
}

.note {
  margin-top: 12px;
  color: var(--sub);
  font-size: 10px;
  line-height: 1.7;
}

.price-alert {
  margin-top: 12px;
  padding: 12px;
  border: 1.5px solid #dc2626;
  border-radius: 12px;
  background: #fef2f2;
  color: #dc2626;
  font-weight: 750;
  font-size: 12px;
  line-height: 1.7;
}

.plan-select-btn {
  width: 100%;
  margin-top: 12px;
}

.plan-select-btn.chosen {
  background: var(--pop-gradient);
  color: #fff;
  border-color: transparent;
}

.hidden {
  display: none;
}

/* MOBILE */

@media (max-width: 560px) {

  .choice-grid.three {
    grid-template-columns: 1fr 1fr;
  }

  .input-row {
    grid-template-columns: 1fr 1fr;
  }

  .card {
    padding: 18px;
  }

  h1 {
    font-size: 22px;
  }

  .data-input {
    font-size: 18px !important;
  }
}
</style>
</head>

/*
 * price：端末総額（1万円単位のおおよそ）。
 * ここを書き換えるだけで金額を更新できる。
 * 通常分割は price ÷ 48回 で概算。
 * 分割リセット（MNP）は前半24回が1円のため reset:1 固定。
 */

const DEVICE_INSTALLMENT_MONTHS = 48;

/*
 * 全カード（6枚）保有、または
 * 3系列すべてのGOLDカードを保有している場合、
 * 新規発行の意味がないのでStep5を丸ごとスキップする
 */

function hasAllCardsAlready(
  cards
) {

  const allCards =
    ["d","dgold","au","augold","paypay","paypaygold"];

  const allGolds =
    ["dgold","augold","paypaygold"];

  const hasAll = list =>
    list.every(id => cards.includes(id));

  return (
    hasAll(allCards) ||
    hasAll(allGolds)
  );

}

  paypaygold: "PayPayカード ゴールド",
  none: "なし"

  }

};

function getDeviceMonthly(
  deviceInfo,
  isReset
) {

  if (isReset) {

    return deviceInfo.reset;

  }

  return Math.round(
    deviceInfo.price /
    DEVICE_INSTALLMENT_MONTHS /
    100
  ) * 100;

}


/* =========================================================
   通話オプション

   ほとんどのプランは共通で
   5分以内かけ放題880円／24時間かけ放題1,980円。
   shortCallIncluded のプランは
   5分（または10分）かけ放題がすでに込み。
========================================================= */

function getCallOptionsForPlan(
  plan
) {

  if (!plan) {
    return [];
  }

  if (plan.shortCallIncluded) {

    return [

      {
        value: "short",
        label: "5分/10分以内かけ放題",
        sub: "プランに込み・追加料金なし",
        price: 0
      },

      {
        value: "all",
        label: "24時間かけ放題",
        sub: "+1,980円/月",
        price: 1980
      }

    ];

  }

  return [

    {
      value: "none",
      label: "オプションなし",
      sub: "30秒22円",
      price: 0
    },

    {
      value: "short",
      label: "5分以内かけ放題",
      sub: "+880円/月",
      price: 880
    },

    {
      value: "all",
      label: "24時間かけ放題",
      sub: "+1,980円/月",
      price: 1980
    }

  ];

}


function getCallOptionPrice(
  plan,
  callOption
) {

  const options =
    getCallOptionsForPlan(plan);

  const found =
    options.find(
      o => o.value === callOption
    );

  return found ? found.price : 0;

}


function getCallOptionLabel(
  plan,
  callOption
) {

  const options =
    getCallOptionsForPlan(plan);

  const found =
    options.find(
      o => o.value === callOption
    );

  return found ? found.label : "未選択";

}

/* =========================================================

function updateProgress() {

  const maxStep = 11;

  const percent =
    Math.min(
      100,
      (state.step / maxStep) * 100
    );

  document
    .getElementById("progressBar")
    .style.width = percent + "%";

========================================================= */

function makeChoice(
  title,
  sub,
  value,
  key,
  selected
) {

  return `
    <button
      type="button"
      class="choice ${selected ? "selected" : ""}"
      data-key="${key}"
      data-value="${value}"
    >

      <span class="choice-title">

      ${
        sub
        ? `

            ${sub}
          </span>

        : ""
      }

    </button>
  `;
}

/* =========================================================
   EVENTS
   ★重要
   inputイベントではrenderしない
========================================================= */

function bindEvents() {


  /* 選択ボタン */

  document
    .querySelectorAll(".choice")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const key =
            this.dataset.key;

          const value =
            this.dataset.value;


          /* 複数選択 */

          if (
            key === "currentCards" ||
            key === "newCards"
          ) {

            if (value === "none") {

              state[key] = ["none"];

            } else {

              state[key] =
                state[key].filter(
                  item => item !== "none"
                );


              if (
                state[key].includes(value)
              ) {

                state[key] =
                  state[key].filter(
                    item => item !== value
                  );

              } else {

                state[key].push(value);

              }

            }


            /*
             * ★カード選択ではrenderしてOK。
             * 入力画面ではないため問題なし。
             */

            render();

            return;
          }


          /* 端末（複数選択・トグル） */

          if (key === "devices") {

            if (state.devices.includes(value)) {

              state.devices =
                state.devices.filter(
                  item => item !== value
                );

            } else {

              state.devices.push(value);

            }

            render();

            return;
          }


          /* familyCounts.docomo のような複合キー */

          if (key.indexOf("familyCounts.") === 0) {

            const group =
              key.split(".")[1];

            state.familyCounts[group] =
              Number(value);

          } else {

            state[key] = value;

          }


          render();

        }
      );

    });


  /* もっと見るボタン（Step9） */

  document
    .querySelectorAll(".expand-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const group =
            this.dataset.group;

          state.resultsExpanded[group] =
            !state.resultsExpanded[group];

          render();

        }
      );

    });


  /* プラン決定ボタン（Step9） */

  document
    .querySelectorAll(".plan-select-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const scenario =
            this.dataset.scenario;

          const carrier =
            this.dataset.carrier;

          const name =
            this.dataset.name;

          const device =
            this.dataset.device || null;

          const list =
            calculatePlans(scenario, device);

          const found =
            list.find(
              p =>
                p.carrier === carrier &&
                p.name === name &&
                p.device === device
            );

          if (found) {

            state.selectedPlan = found;

            state.callOption = null;

            render();

          }

        }
      );

    });


  /* 次へ */

  const next =
    document.getElementById("nextButton");

  if (next) {

    next.addEventListener(
      "click",
      nextStep
    );

  }


  /* 戻る */

  const back =
    document.getElementById("backButton");

  if (back) {

    back.addEventListener(
      "click",
      function() {

        /*
         * STEP2から戻る場合、
         * 現在入力されている値を保存しておく。
         */

        saveDataInputs();

        state.step =
          Math.max(
            0,
            state.step - 1
          );

        /*
         * Step5が自動スキップされる条件なら、
         * 戻るときもStep5を飛ばす
         */

        if (
          state.step === 5 &&
          hasAllCardsAlready(state.currentCards)
        ) {

          state.step--;

        }

        /*
         * Step9より前に戻った場合、
         * 選択済みプランは条件変更で
         * ズレる可能性があるためクリアする
         */

        if (state.step < 9) {

          state.selectedPlan = null;

        }

        render();

      }
    );

  }


  /* 最初から */

  const reset =
    document.getElementById("resetButton");

  if (reset) {

    reset.addEventListener(
      "click",
      function() {

        location.reload();

      }
    );

  }


  /*
   * 平均使用量・MAX使用量：
   * 全角数字を半角に自動変換＋
   * Enterで次の欄にフォーカス移動
   */

  const averageInputEl =
    document.getElementById("averageInput");

  const maxInputEl =
    document.getElementById("maxInput");

  const numericInputIds = [
    "averageInput",
    "maxInput"
  ];

  numericInputIds
    .map(id => document.getElementById(id))
    .forEach(input => {

    if (!input) {
      return;
    }

    input.addEventListener(
      "input",
      function() {

        const converted =
          toHalfWidthNumber(this.value);

        if (converted !== this.value) {

          const pos =
            this.selectionStart;

          this.value = converted;

          if (pos !== null) {

            this.setSelectionRange(
              pos,
              pos
            );

          }

        }

      }
    );

  });

  if (averageInputEl && maxInputEl) {

    averageInputEl.addEventListener(
      "keydown",
      function(e) {

        /*
         * IME変換中のEnterは
         * 変換確定に使わせる（フォーカス移動しない）
         */

        if (
          e.key === "Enter" &&
          !e.isComposing &&
          e.keyCode !== 229
        ) {

          e.preventDefault();

          maxInputEl.focus();

        }

      }
    );

  }

}


/* =========================================================
   全角数字→半角変換
========================================================= */

function toHalfWidthNumber(
  str
) {

  return str.replace(
    /[０-９．]/g,
    ch =>
      String.fromCharCode(
        ch.charCodeAt(0) - 0xFEE0
      )
  );

}


/* =========================================================
   入力値を保存
========================================================= */

function saveDataInputs() {

  const averageInput =
    document.getElementById("averageInput");

  const maxInput =
    document.getElementById("maxInput");


  if (averageInput) {

    const value =
      averageInput.value.trim();

    state.averageGB =
      value === ""
      ? null
      : Number(value);

  }


  if (maxInput) {

    const value =
      maxInput.value.trim();

    state.maxGB =
      value === ""
      ? null
      : Number(value);

  }


}


/* =========================================================
   NEXT STEP
========================================================= */

function nextStep() {


  /* STEP 0 */

  if (state.step === 0) {

    if (!state.deviceChoice) {

      alert(
        "相談内容を選択してください。"
      );

      return;

    }

  }


  /* STEP 1 */

  if (state.step === 1) {

    if (!state.currentCarrier) {

      alert(
        "現在のキャリアを選択してください。"
      );

      return;

    }

  }


  /* STEP 2
     ★入力欄から直接読み取る
  */

  if (state.step === 2) {

    const averageInput =
      document.getElementById(
        "averageInput"
      );

    const maxInput =
      document.getElementById(
        "maxInput"
      );


    if (
      !averageInput ||
      !maxInput
    ) {

      alert(
        "入力欄を読み込めませんでした。"
      );

      return;

    }


    const averageText =
      toHalfWidthNumber(
        averageInput.value.trim()
      );

    const maxText =
      toHalfWidthNumber(
        maxInput.value.trim()
      );


    if (
      averageText === "" ||
      maxText === ""
    ) {

      alert(
        "平均使用量とMAX使用量を入力してください。"
      );

      return;

    }


    const average =
      Number(averageText);

    const max =
      Number(maxText);


    if (
      !Number.isFinite(average) ||
      !Number.isFinite(max) ||
      average <= 0 ||
      max <= 0
    ) {

      alert(
        "0より大きい数字を入力してください。"
      );

      return;

    }


    if (max < average) {

      alert(
        "MAX使用量は平均使用量以上にしてください。"
      );

      return;

    }


    state.averageGB =
      average;

    state.maxGB =
      max;

  }



  /* STEP 4 */

  if (state.step === 4) {

    if (!state.currentCards.length) {

      state.currentCards = ["none"];

    }


    /*
     * 全カード保有 or 3系列すべてGOLD保有の場合、
     * 新規発行するカードがないのでStep5をスキップ
     */

    if (hasAllCardsAlready(state.currentCards)) {

      state.newCards = ["none"];

      state.step++;

    }

  }


  /* STEP 5 */

  if (state.step === 5) {

    if (!state.newCards.length) {

      state.newCards = ["none"];

    }

  }


  /* STEP 7 */

  if (
    state.step === 7 &&
    state.deviceChoice !== "sim"
  ) {

    if (!state.devices.length) {

      alert(
        "希望端末を選択してください。"
      );

      return;

    }

  }


  /* STEP 8 */

  if (state.step === 8) {

    if (!state.usagePriority) {

      alert(
        "平均重視かMAX重視かを選択してください。"
      );

      return;

    }

  }


  /* STEP 9 */

  if (state.step === 9) {

    if (!state.selectedPlan) {

      alert(
        "ご案内するプランを1つ選んでください。"
      );

      return;

    }

  }


  /* STEP 10 */

  if (state.step === 10) {

    if (!state.callOption) {

      alert(
        "通話オプションを選択してください。"
      );

      return;

    }

  }


  state.step++;

  render();

}


/* =========================================================
   PLAN CALCULATION
========================================================= */

function calculatePlans(
  scenario,
  deviceName
) {

  /*
   * STEP8ではまだusagePriorityがない。
   * その場合は平均を仮基準にする。
   */

  const usage =
    state.usagePriority === "max"
    ? state.maxGB
    : state.averageGB;


  const result = [];


  PLANS.forEach(plan => {


    /* 機種変更 */

    if (
      scenario === "change" &&
      !isSameCarrier(plan.carrier)
    ) {

      return;

    }


    /*
     * MNP
     *
     * MNP＝キャリアの乗り換え。
     * 現在と同じキャリアグループの
     * プランは対象外。
     */

    if (
      scenario === "mnp" &&
      isSameCarrier(plan.carrier)
    ) {

      return;

    }


    /*
     * MNP＋端末
     *
     * YM / UQへMNPする場合
     * iPhone17は不可
     */

    if (
      scenario === "mnp" &&
      deviceName === "iPhone 17" &&
      (
        plan.carrier === "Y!mobile" ||
        plan.carrier === "UQ mobile"
      )
    ) {

      return;

    }


    /*
     * 60歳以上限定プラン
     */

    if (
      plan.seniorOnly &&
      state.isSenior !== "yes"
    ) {

      return;

    }


    /* データ容量 */

    const index =
      getPlanIndex(
        plan,
        usage
      );


    const limit =
      plan.limits[index];


    /*
     * 使用量を超えるプランは除外
     */

    if (
      limit !== Infinity &&
      limit < usage
    ) {

      return;

    }


    let communication =
      plan.prices[index];


    let discountLabels = [];


    /* カード */

    const cardResult =
      getCardDiscount(plan);

    communication -=
      cardResult.amount;


    if (cardResult.label) {

      discountLabels.push(
        cardResult.label
      );

    }


    /* 光・ガス */

    const homeResult =
      getHomeDiscount(plan);

    communication -=
      homeResult.amount;


    if (homeResult.label) {

      discountLabels.push(
        homeResult.label
      );

    }


    /* 家族 */

    const familyGroup =
      carrierGroup(plan.carrier);

    const familyCountForPlan =
      familyGroup &&
      typeof state.familyCounts[familyGroup] === "number"
      ? state.familyCounts[familyGroup]
      : 1;

    const familyIndex =
      familyCountForPlan >= 3
      ? 2
      : familyCountForPlan === 2
        ? 1
        : 0;


    const familyDiscount =
      plan.familyDiscount
      ? (
          plan.familyDiscount[
            familyIndex
          ] || 0
        )
      : 0;


    communication -=
      familyDiscount;


    if (familyDiscount > 0) {

      discountLabels.push(
        "家族割"
      );

    }


    /* ドコモでんきセット割 */

    if (
      plan.denkiDiscount &&
      state.docomoDenki === "yes"
    ) {

      communication -=
        plan.denkiDiscount;

      discountLabels.push(
        "ドコモでんきセット割"
      );

    }


    /* 長期利用割（ドコモ） */

    if (
      plan.longTermDiscount &&
      state.docomoYears !== "none"
    ) {

      const longTermAmount =
        plan.longTermDiscount[
          state.docomoYears
        ] || 0;

      if (longTermAmount > 0) {

        communication -=
          longTermAmount;

        discountLabels.push(
          state.docomoYears === "20"
          ? "長期利用割（20年以上）"
          : "長期利用割（10年以上）"
        );

      }

    }


    communication =
      Math.max(
        0,
        communication
      );


    /* 端末 */

    let device = 0;


    if (
      scenario !== "sim" &&
      deviceName
    ) {

      const deviceInfo =
        DEVICES[deviceName];

      device =
        getDeviceMonthly(
          deviceInfo,
          scenario === "mnp"
        );

    }


    const total =
      communication + device;


    result.push({

      scenario:
        scenario,

      device:
        deviceName || null,

      carrier:
        plan.carrier,

      name:
        plan.name,

      limit:
        limit,

      communication:
        communication,

      deviceCost:
        device,

      total:
        total,

      discountLabels:
        discountLabels,

      shortCallIncluded:
        plan.shortCallIncluded || false

    });

  });


  result.sort(
    (a,b) =>
      a.total - b.total
  );


  return result;

}


/* =========================================================
   候補一覧（表示用）

   SIMのみ→そのまま1本
   端末を変える場合→MNP案／機種変更案の
   両方をまとめて金額順に並べる。
   （どちらが得かは最後にまとめて比較して決める）
========================================================= */

function getCandidates() {

  if (state.deviceChoice === "sim") {

    return calculatePlans("sim", null);

  }


  const result = [];

  state.devices.forEach(device => {

    result.push(
      ...calculatePlans("mnp", device)
    );

    result.push(
      ...calculatePlans("change", device)
    );

  });

  return result.sort(
    (a,b) =>
      a.total - b.total
  );

}


/* =========================================================
   候補一覧（Step9用・シナリオ別）

   選ばれた端末すべて分の候補を、
   MNP／機種変更それぞれでまとめて返す。
========================================================= */

function getCandidatesForScenario(
  scenario
) {

  const result = [];

  state.devices.forEach(device => {

    result.push(
      ...calculatePlans(scenario, device)
    );

  });

  return result.sort(
    (a,b) =>
      a.total - b.total
  );

}


/* =========================================================
   CARRIER GROUP
   docomo/ahamo・au/UQ mobile・SoftBank/Y!mobile
   をそれぞれ同一グループとして扱う。
   「その他」やnullは常に別グループ扱い。
========================================================= */

function carrierGroup(
  carrier
) {

  if (
    carrier === "docomo" ||
    carrier === "ahamo"
  ) {

    return "docomo";

  }


  if (
    carrier === "au" ||
    carrier === "UQ mobile"
  ) {

    return "au";

  }


  if (
    carrier === "SoftBank" ||
    carrier === "Y!mobile"
  ) {

    return "softbank";

  }


  return null;

}


/* =========================================================
   SAME CARRIER
========================================================= */

function isSameCarrier(
  planCarrier
) {

  const planGroup =
    carrierGroup(planCarrier);

  const currentGroup =
    carrierGroup(state.currentCarrier);

  return (
    planGroup !== null &&
    planGroup === currentGroup
  );

}


/* =========================================================
   DATA INDEX
========================================================= */

function getPlanIndex(
  plan,
  usage
) {

  for (
    let i = 0;
    i < plan.limits.length;
    i++
  ) {

    if (
      usage <= plan.limits[i]
    ) {

      return i;

    }

  }


  return (
    plan.limits.length - 1
  );

}


/* =========================================================
   CARD DISCOUNT
========================================================= */

function getCardDiscount(
  plan
) {

  if (!plan.cardType) {

    return {
      amount: 0,
      label: null
    };

  }


  const allCards =
    state.currentCards.concat(
      state.newCards
    );


  const type =
    plan.cardType;


  const normalId =
    type === "docomo"
    ? "d"
    : type === "au"
      ? "au"
      : "paypay";


  const goldId =
    type === "docomo"
    ? "dgold"
    : type === "au"
      ? "augold"
      : "paypaygold";


  const hasGold =
    allCards.includes(goldId);


  const hasNormal =
    allCards.includes(normalId);


  if (
    !hasGold &&
    !hasNormal
  ) {

    return {
      amount: 0,
      label: null
    };

  }


  if (
    type === "paypay" &&
    plan.carrier === "Y!mobile"
  ) {

    if (hasGold) {

      return {
        amount:
          plan.cardGoldDiscount || 770,
        label:
          "PayPayカード ゴールド"
      };

    }


    return {
      amount:
        plan.cardDiscount || 330,
      label:
        "PayPayカード"
    };

  }


  if (
    type === "paypay"
  ) {

    if (hasGold) {

      return {
        amount:
          plan.cardGoldDiscount || 550,
        label:
          "PayPayカード ゴールド"
      };

    }


    return {
      amount:
        plan.cardDiscount || 330,
      label:
        "PayPayカード"
    };

  }


  if (
    type === "docomo"
  ) {

    if (hasGold) {

      return {
        amount:
          plan.cardGoldDiscount || 550,
        label:
          "dカード GOLD"
      };

    }

    return {
      amount:
        plan.cardDiscount || 220,
      label:
        "dカード"
    };

  }


  if (
    type === "au"
  ) {

    return {
      amount:
        plan.cardDiscount || 220,
      label:
        hasGold
        ? "au PAY ゴールドカード"
        : "au PAY カード"
    };

  }


  return {
    amount: 0,
    label: null
  };

}


/* =========================================================
   HOME
========================================================= */

function getHomeDiscount(
  plan
) {

  const group =
    carrierGroup(plan.carrier);

  if (
    !group ||
    !plan.homeDiscount
  ) {

    return {
      amount: 0,
      label: null
    };

  }


  const alreadyHas =
    state.homeCarrier === group;

  const willingToGet =
    state.newHome === "yes";


  /*
   * auスマートバリューは、
   * 「ネット回線＋固定電話」のセットが原則条件。
   * ネットがない場合はauでんきでも代替判定できる
   * （自宅セット割・でんき／固定電話不要）。
   */

  const auInternetPath =
    group === "au" &&
    (alreadyHas || willingToGet) &&
    state.auHomePhone === "yes";

  const auDenkiPath =
    group === "au" &&
    state.auDenki === "yes";


  if (group === "au") {

    if (!auInternetPath && !auDenkiPath) {

      return {
        amount: 0,
        label: null
      };

    }

  } else if (
    !alreadyHas &&
    !willingToGet
  ) {

    return {
      amount: 0,
      label: null
    };

  }


  const names = {
    docomo: "ドコモ光セット割",
    au: "auスマートバリュー",
    softbank: "おうち割光セット"
  };

  let label = names[group];


  if (group === "au") {

    label =
      auInternetPath
      ? "auスマートバリュー" + (alreadyHas ? "" : "（新規契約）")
      : "自宅セット割（でんき）";

  } else if (!alreadyHas) {

    label += "（新規契約）";

  }


  return {
    amount: plan.homeDiscount,
    label: label
  };

}


/* =========================================================
   MONEY
========================================================= */

function money(
  number
) {

  return Math.round(
    number
  ).toLocaleString(
    "ja-JP"
  ) + "円";

}


/* =========================================================
   START
========================================================= */

render();

</script>
