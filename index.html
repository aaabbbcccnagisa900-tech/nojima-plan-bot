<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>料金案内bot</title>

<style>
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #171717;
  --sub: #6b7280;
  --line: #e5e7eb;
  --black: #111111;
  --green: #087f5b;
  --orange: #f97316;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Noto Sans JP",
    sans-serif;
}

button,
input,
select {
  font-family: inherit;
}

button {
  touch-action: manipulation;
}

.container {
  width: min(720px, 100%);
  margin: auto;
  min-height: 100vh;
}

/* HEADER */

.header {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 18px 18px 14px;
  background: rgba(245,246,248,.94);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}

.mascot-banner {
  display: flex;
  justify-content: flex-end;
  padding: 14px 15% 0 15px;
}

.mascot-banner img {
  height: 150px;
  width: auto;
}

.inherited-telop {
  margin: 6px 15px 0;
  padding: 8px 12px;
  background: #eef0f3;
  border: 1px solid var(--line);
  border-radius: 12px;
  color: #333;
  font-size: 11px;
  line-height: 1.6;
}

.logo {
  font-size: 18px;
  font-weight: 800;
}

.subtitle {
  margin-top: 3px;
  font-size: 11px;
  color: var(--sub);
}

.progress {
  margin-top: 14px;
  height: 5px;
  background: #e5e7eb;
  border-radius: 99px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: var(--black);
  transition: width .25s ease;
}

/* MAIN */

main {
  padding: 18px 15px 50px;
}

.card {
  background: var(--card);
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 12px 35px rgba(0,0,0,.06);
  border: 1px solid rgba(0,0,0,.04);
}

h1 {
  margin: 0 0 8px;
  font-size: 25px;
  line-height: 1.35;
}

h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.description {
  margin: 0 0 20px;
  color: var(--sub);
  font-size: 13px;
  line-height: 1.7;
}

/* CHOICES */

.choice-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.choice-grid.three {
  grid-template-columns: repeat(3, 1fr);
}

.choice {
  width: 100%;
  min-height: 66px;
  padding: 14px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 17px;
  text-align: left;
  cursor: pointer;
  transition: .15s;
}

.choice:hover {
  border-color: #9ca3af;
}

.choice.selected {
  border: 2px solid var(--black);
  background: #f8fafc;
  padding: 13px;
}

.choice-title {
  display: block;
  font-weight: 750;
  font-size: 14px;
}

.choice-sub {
  display: block;
  margin-top: 4px;
  color: var(--sub);
  font-size: 11px;
  line-height: 1.5;
}

/* INPUT */

.input-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.input-box {
  min-width: 0;
}

.label {
  display: block;
  margin: 13px 0 7px;
  font-size: 12px;
  font-weight: 750;
}

.data-input {
  display: block !important;
  width: 100% !important;
  height: 54px !important;
  padding: 12px 14px !important;
  border: 1px solid #d1d5db !important;
  border-radius: 14px !important;
  background: #ffffff !important;
  color: #111111 !important;
  font-size: 17px !important;
  line-height: 1.2 !important;
  outline: none !important;
  appearance: none;
  -webkit-appearance: none;
  opacity: 1 !important;
  pointer-events: auto !important;
  position: relative !important;
  z-index: 20 !important;
}

.data-input:focus {
  border: 2px solid #111111 !important;
}

.unit {
  margin-top: 6px;
  color: var(--sub);
  font-size: 11px;
}

/* BUTTONS */

.actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.primary,
.secondary {
  border: 0;
  border-radius: 15px;
  padding: 13px 18px;
  font-size: 14px;
  font-weight: 750;
  cursor: pointer;
}

.primary {
  flex: 1;
  background: var(--black);
  color: white;
}

.secondary {
  background: #eef0f3;
  color: #333;
}

/* TAG */

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 10px 0;
}

.tag {
  padding: 5px 9px;
  background: #f1f3f5;
  border-radius: 999px;
  color: #475467;
  font-size: 11px;
}

/* RESULT */

.result {
  margin-top: 12px;
  padding: 17px;
  border: 1px solid var(--line);
  border-radius: 20px;
}

.result:first-child {
  border: 2px solid var(--black);
}

.rank {
  color: var(--sub);
  font-size: 11px;
  font-weight: 800;
}

.plan-name {
  margin-top: 4px;
  font-size: 18px;
  font-weight: 850;
}

.total {
  margin-top: 5px;
  font-size: 29px;
  font-weight: 900;
}

.total span {
  color: var(--sub);
  font-size: 11px;
  font-weight: 500;
}

.detail {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px solid var(--line);
  font-size: 12px;
}

.good {
  margin-top: 10px;
  padding: 9px;
  border-radius: 12px;
  background: #ecfdf3;
  color: var(--green);
  font-size: 11px;
  line-height: 1.6;
}

.warning {
  margin-top: 10px;
  padding: 9px;
  border-radius: 12px;
  background: #fff7ed;
  color: #9a3412;
  font-size: 11px;
  line-height: 1.6;
}

.note {
  margin-top: 12px;
  color: var(--sub);
  font-size: 10px;
  line-height: 1.7;
}

.customer-info {
  margin-top: 14px;
  color: var(--sub);
  font-size: 11px;
}

.price-alert {
  margin-top: 12px;
  padding: 12px;
  border: 1.5px solid #dc2626;
  border-radius: 12px;
  background: #fef2f2;
  color: #dc2626;
  font-weight: 750;
  font-size: 12px;
  line-height: 1.7;
}

.plan-select-btn,
.full-width-btn {
  width: 100%;
  margin-top: 12px;
}

.plan-select-btn.chosen {
  background: var(--black);
  color: #fff;
}

.hidden {
  display: none;
}

/* MOBILE */

@media (max-width: 560px) {

  .choice-grid.three {
    grid-template-columns: 1fr 1fr;
  }

  .input-row {
    grid-template-columns: 1fr 1fr;
  }

  .card {
    padding: 18px;
  }

  h1 {
    font-size: 22px;
  }

  .data-input {
    font-size: 18px !important;
  }
}
</style>
</head>

function getDeviceMonthly(
  deviceInfo,
  isReset
) {

  if (isReset) {

    return deviceInfo.reset;

  }

  return Math.round(
    deviceInfo.price /
    DEVICE_INSTALLMENT_MONTHS /
    100
  ) * 100;

}


/* =========================================================
   通話オプション

   ほとんどのプランは共通で
   5分以内かけ放題880円／24時間かけ放題1,980円。
   shortCallIncluded のプランは
   5分（または10分）かけ放題がすでに込み。
========================================================= */

function getCallOptionsForPlan(
  plan
) {

  if (!plan) {
    return [];
  }

  if (plan.shortCallIncluded) {

    return [

      {
        value: "short",
        label: "5分/10分以内かけ放題",
        sub: "プランに込み・追加料金なし",
        price: 0
      },

      {
        value: "all",
        label: "24時間かけ放題",
        sub: "+1,980円/月",
        price: 1980
      }

    ];

  }

  return [

    {
      value: "none",
      label: "オプションなし",
      sub: "30秒22円",
      price: 0
    },

    {
      value: "short",
      label: "5分以内かけ放題",
      sub: "+880円/月",
      price: 880
    },

    {
      value: "all",
      label: "24時間かけ放題",
      sub: "+1,980円/月",
      price: 1980
    }

  ];

}


function getCallOptionPrice(
  plan,
  callOption
) {

  const options =
    getCallOptionsForPlan(plan);

  const found =
    options.find(
      o => o.value === callOption
    );

  return found ? found.price : 0;

}


function getCallOptionLabel(
  plan,
  callOption
) {

  const options =
    getCallOptionsForPlan(plan);

  const found =
    options.find(
      o => o.value === callOption
    );

  return found ? found.label : "未選択";

}

/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

  const maxStep = 12;

  const percent =
    Math.min(
      100,
      (state.step / maxStep) * 100
    );

  document
    .getElementById("progressBar")
    .style.width = percent + "%";
}


/* =========================================================
   CHOICE
========================================================= */

function makeChoice(
  title,
  sub,
  value,
  key,
  selected
) {

  return `
    <button
      type="button"
      class="choice ${selected ? "selected" : ""}"
      data-key="${key}"
      data-value="${value}"
    >

      <span class="choice-title">
        ${title}
      </span>

      ${
        sub
        ? `
          <span class="choice-sub">
            ${sub}
          </span>
        `
        : ""
      }

    </button>
  `;
}


/* =========================================================
   ACTIONS
========================================================= */

function actions(text = "次へ") {

  return `
    <div class="actions">

      <button
        type="button"
        class="secondary"
        id="backButton"
      >
        戻る
      </button>

      <button
        type="button"
        class="primary"
        id="nextButton"
      >
        ${text}
      </button>

    </div>
  `;
}


/* =========================================================
   PLAN RESULT CARD
   Step9で使う、選択ボタン付きのプラン結果カード。
========================================================= */

function planResultCard(
  plan,
  rank,
  showSelectButton = true
) {

  const isSelected =
    state.selectedPlan &&
    state.selectedPlan.carrier === plan.carrier &&
    state.selectedPlan.name === plan.name &&
    state.selectedPlan.scenario === plan.scenario &&
    state.selectedPlan.device === plan.device;

  return `

    <div class="result">

      ${
        rank
        ? `<div class="rank">${rank}位</div>`
        : ""
      }

      ${
        (plan.scenario === "mnp" || plan.scenario === "change" || plan.device)
        ? `
          <div class="tags">
            ${
              plan.scenario === "mnp" || plan.scenario === "change"
              ? `<span class="tag">${
                  plan.scenario === "mnp" ? "MNP" : "機種変更"
                }</span>`
              : ""
            }
            ${
              plan.device
              ? `<span class="tag">${plan.device}</span>`
              : ""
            }
          </div>
        `
        : ""
      }

      <div class="plan-name">
        ${plan.carrier} ${plan.name}
      </div>

      <div class="total">
        ${money(plan.total)}
        <span>/月・概算（通信料＋端末代）</span>
      </div>


      <div class="detail">
        <span>通信料金</span>
        <b>${money(plan.communication)}/月</b>
      </div>


      ${
        plan.scenario !== "sim"
        ? `
          <div class="detail">

            <span>
              端末代
              ${
                plan.scenario === "mnp"
                ? "（分割リセット）"
                : "（通常分割）"
              }
            </span>

            <b>約${money(plan.deviceCost)}/月</b>

          </div>
        `
        : ""
      }


      <div class="detail">
        <span>データ上限</span>
        <b>
          ${
            plan.limit === Infinity
            ? "無制限"
            : plan.limit + "GB"
          }
        </b>
      </div>


      <div class="tags">

        ${
          plan.discountLabels.length
          ? plan.discountLabels.map(
              label =>
              `<span class="tag">${label}</span>`
            ).join("")
          : `<span class="tag">追加割引なし</span>`
        }

      </div>

      ${
        plan.discountLabels.some(l => l.includes("⚠️"))
        ? `
          <div class="note">
            ⚠️ の割引は、カードの新規発行または
            光回線・でんきの新規契約が必要です。
            別途お手続きをお願いいたします。
          </div>
        `
        : ""
      }


      ${
        plan.limit !== Infinity &&
        plan.limit < state.maxGB
        ? `
          <div class="warning">
            MAX使用量 ${state.maxGB}GB に対して、
            プラン上限は ${plan.limit}GBです。<br>
            MAX月には不足する可能性があります。
          </div>
        `
        : `
          <div class="good">
            ${
              plan.limit === Infinity
              ? "無制限なのでMAX使用量までカバーできます。"
              : `最大 ${state.maxGB}GBまでカバーできます。`
            }
          </div>
        `
      }


      ${
        showSelectButton
        ? `
          <button
            type="button"
            class="secondary plan-select-btn ${isSelected ? "chosen" : ""}"
            data-scenario="${plan.scenario}"
            data-carrier="${plan.carrier}"
            data-name="${plan.name}"
            data-device="${plan.device || ""}"
          >
            ${isSelected ? " この内容に決定" : "この内容に決定"}
          </button>
        `
        : ""
      }

    </div>

  `;

}


/* =========================================================
   RENDER
========================================================= */

let lastMascotStep = null;

function updateMascot() {

  if (state.step === lastMascotStep) {
    return;
  }

  lastMascotStep = state.step;

  const mascotImg =
    document.getElementById("mascotImg");

  if (!mascotImg) {
    return;
  }

  const index =
    Math.floor(Math.random() * MASCOT_IMAGES.length);

  mascotImg.src = MASCOT_IMAGES[index];

}


/* =========================================================
   引き継ぎ情報テロップ
   （家族コンサル時に、カード・光・でんきの
   引き継ぎ内容を固定表示する）
========================================================= */

function buildInheritedSummary() {

  const parts = [];

  const cardParts = [];

  state.currentCards.forEach(id => {
    if (id !== "none") {
      cardParts.push(CARD_LABELS[id] || id);
    }
  });

  state.newCards.forEach(id => {
    if (id !== "none") {
      cardParts.push((CARD_LABELS[id] || id) + " ⚠️");
    }
  });

  if (cardParts.length) {
    parts.push(cardParts.join("・"));
  }


  const homeNames = {
    docomo: "ドコモ光",
    au: "auひかり等",
    softbank: "SoftBank光等"
  };

  if (state.homeCarrier !== "none") {

    parts.push(homeNames[state.homeCarrier]);

  } else if (state.newHome === "yes") {

    parts.push("光回線 新規契約予定 ⚠️");

  }


  if (state.auHomePhone === "yes") {
    parts.push("au固定電話あり");
  }

  if (state.auDenki === "yes") {
    parts.push("auでんき");
  }

  if (state.docomoDenki === "yes") {
    parts.push("ドコモでんき");
  }


  return parts.join(" / ");

}

function updateInheritedTelop() {

  const telop =
    document.getElementById("inheritedTelop");

  if (!telop) {
    return;
  }

  if (
    state.consultNumber <= 1 &&
    !state.skipCardHomeSteps
  ) {

    telop.classList.add("hidden");
    telop.innerHTML = "";
    return;

  }

  const lines = [];

  if (state.consultNumber > 1) {

    lines.push(
      state.consultNumber + "人目のご案内"
    );

  }

  if (state.skipCardHomeSteps) {

    const summary =
      buildInheritedSummary();

    lines.push(
      "引き継ぎ中：" + (summary || "なし")
    );

  }

  telop.classList.remove("hidden");

  telop.innerHTML =
    lines.join("　/　");

}

            : `<p class="description">条件に合う候補がありません。</p>`
          }

          </div>

  }


  /* =========================
     STEP 11
  ========================= */

  if (state.step === 11) {

      getCallOptionsForPlan(state.selectedPlan);

/* =========================================================
   EVENTS
   重要
   inputイベントではrenderしない
========================================================= */

function bindEvents() {


  /* 選択ボタン */

  document
    .querySelectorAll(".choice")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const key =
            this.dataset.key;

          const value =
            this.dataset.value;


          /* 複数選択 */

          if (
            key === "currentCards" ||
            key === "newCards"
          ) {

            if (value === "none") {

              state[key] = ["none"];

            } else {

              state[key] =
                state[key].filter(
                  item => item !== "none"
                );


              if (
                state[key].includes(value)
              ) {

                state[key] =
                  state[key].filter(
                    item => item !== value
                  );

              } else {

                state[key].push(value);

              }

            }


            /*
             * カード選択ではrenderしてOK。
             * 入力画面ではないため問題なし。
             */

            render();

            return;
          }


          /* 端末（複数選択・トグル） */

          if (key === "devices") {

            if (state.devices.includes(value)) {

              state.devices =
                state.devices.filter(
                  item => item !== value
                );

            } else {

              state.devices.push(value);

            }

            render();

            return;
          }


          /* familyCounts.docomo のような複合キー */

          if (key.indexOf("familyCounts.") === 0) {

            const group =
              key.split(".")[1];

            state.familyCounts[group] =
              Number(value);

          } else {

            state[key] = value;

          }


          render();

        }
      );

    });


  /* もっと見るボタン（Step9） */

  document
    .querySelectorAll(".expand-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const group =
            this.dataset.group;

          state.resultsExpanded[group] =
            !state.resultsExpanded[group];

          render();

        }
      );

    });


  /* プラン決定ボタン（Step9） */

  document
    .querySelectorAll(".plan-select-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        function() {

          const scenario =
            this.dataset.scenario;

          const carrier =
            this.dataset.carrier;

          const name =
            this.dataset.name;

          const device =
            this.dataset.device || null;

          const list =
            calculatePlans(scenario, device);

          const found =
            list.find(
              p =>
                p.carrier === carrier &&
                p.name === name &&
                p.device === device
            );

          if (found) {

            state.selectedPlan = found;

            state.callOption = null;

            render();

          }

        }
      );

    });


  /* 次へ */

  const next =
    document.getElementById("nextButton");

  if (next) {

    next.addEventListener(
      "click",
      nextStep
    );

  }


  /* 戻る */

  const back =
    document.getElementById("backButton");

  if (back) {

    back.addEventListener(
      "click",
      function() {

        /*
         * STEP2から戻る場合、
         * 現在入力されている値を保存しておく。
         */

        saveDataInputs();

        state.step =
          Math.max(
            0,
            state.step - 1
          );

        /*
         * Step5が自動スキップされる条件なら、
         * 戻るときもStep5を飛ばす
         */

        if (
          state.step === 6 &&
          hasAllCardsAlready(state.currentCards)
        ) {

          state.step--;

        }

        /*
         * 家族コンサルでカード・光・でんきの情報を
         * 引き継いでいる場合、戻るときもStep5〜7を飛ばす
         */

        if (
          state.skipCardHomeSteps &&
          state.step >= 5 &&
          state.step <= 7
        ) {

          state.step = 4;

        }

        /*
         * Step9より前に戻った場合、
         * 選択済みプランは条件変更で
         * ズレる可能性があるためクリアする
         */

        if (state.step < 10) {

          state.selectedPlan = null;

        }

        render();

      }
    );

  }


  /* 入力せずに進む（Step0） */

  const skip =
    document.getElementById("skipButton");

  if (skip) {

    skip.addEventListener(
      "click",
      function() {

        state.customerName = "";
        state.customerPhone = "";
        state.customerAge = "";

        state.step++;

        render();

      }
    );

  }


  /* 追加で家族をコンサルする */

  const familyConsult =
    document.getElementById("familyConsultButton");

  if (familyConsult) {

    familyConsult.addEventListener(
      "click",
      function() {

        const inherit =
          confirm(
            "カード・光回線・でんきの情報を引き継ぎますか？"
          );

        state.consultNumber++;

        const kept =
          inherit
          ? {
              currentCards: state.currentCards.slice(),
              newCards: state.newCards.slice(),
              homeCarrier: state.homeCarrier,
              newHome: state.newHome,
              auHomePhone: state.auHomePhone,
              auDenki: state.auDenki,
              docomoDenki: state.docomoDenki,
              familyCounts: {
                docomo: state.familyCounts.docomo,
                au: state.familyCounts.au,
                softbank: state.familyCounts.softbank
              }
            }
          : null;

        state.step = 0;

        state.customerName = "";
        state.customerPhone = "";
        state.customerAge = "";

        state.deviceChoice = null;
        state.selectedPlan = null;

        state.currentCarrier = null;

        state.averageGB = null;
        state.maxGB = null;

        state.familyCounts = {
          docomo: 1,
          au: 1,
          softbank: 1
        };

        state.isSenior = "no";

        state.docomoYears = "none";

        state.devices = [];

        state.usagePriority = null;

        state.resultsExpanded = {
          sim: false,
          mnp: false,
          change: false
        };

        state.callOption = null;

        if (kept) {

          state.currentCards = kept.currentCards;
          state.newCards = kept.newCards;
          state.homeCarrier = kept.homeCarrier;
          state.newHome = kept.newHome;
          state.auHomePhone = kept.auHomePhone;
          state.auDenki = kept.auDenki;
          state.docomoDenki = kept.docomoDenki;
          state.familyCounts = kept.familyCounts;

          state.skipCardHomeSteps = true;

        } else {

          state.currentCards = [];
          state.newCards = [];
          state.homeCarrier = "none";
          state.newHome = "no";
          state.auHomePhone = "no";
          state.auDenki = "no";
          state.docomoDenki = "no";

          state.skipCardHomeSteps = false;

        }

        render();

      }
    );

  }


  /* 最初から */

  const reset =
    document.getElementById("resetButton");

  if (reset) {

    reset.addEventListener(
      "click",
      function() {

        location.reload();

      }
    );

  }


  /*
   * 平均使用量・MAX使用量：
   * 全角数字を半角に自動変換＋
   * Enterで次の欄にフォーカス移動
   */

  const averageInputEl =
    document.getElementById("averageInput");

  const maxInputEl =
    document.getElementById("maxInput");

  const numericInputIds = [
    "averageInput",
    "maxInput",
    "customerAgeInput"
  ];

  numericInputIds
    .map(id => document.getElementById(id))
    .forEach(input => {

    if (!input) {
      return;
    }

    input.addEventListener(
      "input",
      function() {

        const converted =
          toHalfWidthNumber(this.value);

        if (converted !== this.value) {

          const pos =
            this.selectionStart;

          this.value = converted;

          if (pos !== null) {

            this.setSelectionRange(
              pos,
              pos
            );

          }

        }

      }
    );

  });

  if (averageInputEl && maxInputEl) {

    averageInputEl.addEventListener(
      "keydown",
      function(e) {

        /*
         * IME変換中のEnterは
         * 変換確定に使わせる（フォーカス移動しない）
         */

        if (
          e.key === "Enter" &&
          !e.isComposing &&
          e.keyCode !== 229
        ) {

          e.preventDefault();

          maxInputEl.focus();

        }

      }
    );

  }

}


/* =========================================================
   全角数字→半角変換
========================================================= */

function toHalfWidthNumber(
  str
) {

  return str.replace(
    /[０-９．]/g,
    ch =>
      String.fromCharCode(
        ch.charCodeAt(0) - 0xFEE0
      )
  );

}


/* =========================================================
   入力値を保存
========================================================= */

function saveDataInputs() {

  const averageInput =
    document.getElementById("averageInput");

  const maxInput =
    document.getElementById("maxInput");


  if (averageInput) {

    const value =
      averageInput.value.trim();

    state.averageGB =
      value === ""
      ? null
      : Number(value);

  }


  if (maxInput) {

    const value =
      maxInput.value.trim();

    state.maxGB =
      value === ""
      ? null
      : Number(value);

  }


}


/* =========================================================
   NEXT STEP
========================================================= */

function nextStep() {


  /* STEP 0 */

  if (state.step === 0) {

    const nameInput =
      document.getElementById("customerNameInput");

    const phoneInput =
      document.getElementById("customerPhoneInput");

    const ageInput =
      document.getElementById("customerAgeInput");

    if (nameInput) {
      state.customerName = nameInput.value.trim();
    }

    if (phoneInput) {
      state.customerPhone =
        toHalfWidthNumber(phoneInput.value.trim());
    }

    if (ageInput) {
      state.customerAge =
        toHalfWidthNumber(ageInput.value.trim());
    }

  }


  /* STEP 1 */

  if (state.step === 1) {

    if (!state.deviceChoice) {

      alert(
        "相談内容を選択してください。"
      );

      return;

    }

  }


  /* STEP 2 */

  if (state.step === 2) {

    if (!state.currentCarrier) {

      alert(
        "現在のキャリアを選択してください。"
      );

      return;

    }

  }


  /* STEP 3
     入力欄から直接読み取る
  */

  if (state.step === 3) {

    const averageInput =
      document.getElementById(
        "averageInput"
      );

    const maxInput =
      document.getElementById(
        "maxInput"
      );


    if (
      !averageInput ||
      !maxInput
    ) {

      alert(
        "入力欄を読み込めませんでした。"
      );

      return;

    }


    const averageText =
      toHalfWidthNumber(
        averageInput.value.trim()
      );

    const maxText =
      toHalfWidthNumber(
        maxInput.value.trim()
      );


    if (
      averageText === "" ||
      maxText === ""
    ) {

      alert(
        "平均使用量とMAX使用量を入力してください。"
      );

      return;

    }


    const average =
      Number(averageText);

    const max =
      Number(maxText);


    if (
      !Number.isFinite(average) ||
      !Number.isFinite(max) ||
      average <= 0 ||
      max <= 0
    ) {

      alert(
        "0より大きい数字を入力してください。"
      );

      return;

    }


    if (max < average) {

      alert(
        "MAX使用量は平均使用量以上にしてください。"
      );

      return;

    }


    state.averageGB =
      average;

    state.maxGB =
      max;

  }



  /* STEP 5 */

  if (state.step === 5) {

    if (!state.currentCards.length) {

      state.currentCards = ["none"];

    }


    /*
     * 全カード保有 or 3系列すべてGOLD保有の場合、
     * 新規発行するカードがないのでStep5をスキップ
     */

    if (hasAllCardsAlready(state.currentCards)) {

      state.newCards = ["none"];

      state.step++;

    }

  }


  /* STEP 6 */

  if (state.step === 6) {

    if (!state.newCards.length) {

      state.newCards = ["none"];

    }

  }


  /* STEP 8 */

  if (
    state.step === 8 &&
    state.deviceChoice !== "sim"
  ) {

    if (!state.devices.length) {

      alert(
        "希望端末を選択してください。"
      );

      return;

    }

  }


  /* STEP 9 */

  if (state.step === 9) {

    if (!state.usagePriority) {

      alert(
        "平均重視かMAX重視かを選択してください。"
      );

      return;

    }

  }


  /* STEP 10 */

  if (state.step === 10) {

    if (!state.selectedPlan) {

      alert(
        "ご案内するプランを1つ選んでください。"
      );

      return;

    }

  }


  /* STEP 11 */

  if (state.step === 11) {

    if (!state.callOption) {

      alert(
        "通話オプションを選択してください。"
      );

      return;

    }

  }


  state.step++;


  /*
   * 家族コンサルでカード・光・でんきの情報を
   * 引き継いでいる場合、Step5〜7をまとめて飛ばす
   */

  if (
    state.skipCardHomeSteps &&
    state.step >= 5 &&
    state.step <= 7
  ) {

    state.step = 8;

  }


  render();

}


/* =========================================================
   PLAN CALCULATION
========================================================= */

function calculatePlans(
  scenario,
  deviceName
) {

  /*
   * STEP8ではまだusagePriorityがない。
   * その場合は平均を仮基準にする。
   */

  const usage =
    state.usagePriority === "max"
    ? state.maxGB
    : state.averageGB;


  const result = [];


  PLANS.forEach(plan => {


    /* 機種変更 */

    if (
      scenario === "change" &&
      !isSameCarrier(plan.carrier)
    ) {

      return;

    }


    /*
     * MNP
     *
     * MNP＝キャリアの乗り換え。
     * 現在と同じキャリアグループの
     * プランは対象外。
     */

    if (
      scenario === "mnp" &&
      isSameCarrier(plan.carrier)
    ) {

      return;

    }


    /*
     * MNP＋端末
     *
     * YM / UQへMNPする場合
     * iPhone17は不可
     */

    if (
      scenario === "mnp" &&
      deviceName === "iPhone 17" &&
      (
        plan.carrier === "Y!mobile" ||
        plan.carrier === "UQ mobile"
      )
    ) {

      return;

    }


    /*
     * 60歳以上限定プラン
     */

    if (
      plan.seniorOnly &&
      state.isSenior !== "yes"
    ) {

      return;

    }


    /* データ容量 */

    const index =
      getPlanIndex(
        plan,
        usage
      );


    const limit =
      plan.limits[index];


    /*
     * 使用量を超えるプランは除外
     */

    if (
      limit !== Infinity &&
      limit < usage
    ) {

      return;

    }


    let communication =
      plan.prices[index];


    let discountLabels = [];


    /* カード */

    const cardResult =
      getCardDiscount(plan);

    communication -=
      cardResult.amount;


    if (cardResult.label) {

      discountLabels.push(
        cardResult.label + "（▲" + money(cardResult.amount) + "）"
        + (cardResult.isNew ? " ⚠️" : "")
      );

    }


    /* 光・ガス */

    const homeResult =
      getHomeDiscount(plan);

    communication -=
      homeResult.amount;


    if (homeResult.label) {

      discountLabels.push(
        homeResult.label + "（▲" + money(homeResult.amount) + "）"
        + (homeResult.isNew ? " ⚠️" : "")
      );

    }


    /* 家族 */

    const familyGroup =
      carrierGroup(plan.carrier);

    const familyCountForPlan =
      familyGroup &&
      typeof state.familyCounts[familyGroup] === "number"
      ? state.familyCounts[familyGroup]
      : 1;

    const familyIndex =
      familyCountForPlan >= 3
      ? 2
      : familyCountForPlan === 2
        ? 1
        : 0;


    const familyDiscount =
      plan.familyDiscount
      ? (
          plan.familyDiscount[
            familyIndex
          ] || 0
        )
      : 0;


    communication -=
      familyDiscount;


    if (familyDiscount > 0) {

      discountLabels.push(
        "家族割（▲" + money(familyDiscount) + "）"
      );

    }


    /* ドコモでんきセット割 */

    if (
      plan.denkiDiscount &&
      state.docomoDenki === "yes"
    ) {

      communication -=
        plan.denkiDiscount;

      discountLabels.push(
        "ドコモでんきセット割（▲" + money(plan.denkiDiscount) + "）"
      );

    }


    /* 長期利用割（ドコモ） */

    if (
      plan.longTermDiscount &&
      state.docomoYears !== "none"
    ) {

      const longTermAmount =
        plan.longTermDiscount[
          state.docomoYears
        ] || 0;

      if (longTermAmount > 0) {

        communication -=
          longTermAmount;

        discountLabels.push(
          (state.docomoYears === "20"
          ? "長期利用割（20年以上）"
          : "長期利用割（10年以上）")
          + "（▲" + money(longTermAmount) + "）"
        );

      }

    }


    communication =
      Math.max(
        0,
        communication
      );


    /* 端末 */

    let device = 0;


    if (
      scenario !== "sim" &&
      deviceName
    ) {

      const deviceInfo =
        DEVICES[deviceName];

      device =
        getDeviceMonthly(
          deviceInfo,
          scenario === "mnp"
        );

    }


    const total =
      communication + device;


    result.push({

      scenario:
        scenario,

      device:
        deviceName || null,

      carrier:
        plan.carrier,

      name:
        plan.name,

      limit:
        limit,

      communication:
        communication,

      deviceCost:
        device,

      total:
        total,

      discountLabels:
        discountLabels,

      shortCallIncluded:
        plan.shortCallIncluded || false

    });

  });


  result.sort(
    (a,b) =>
      a.total - b.total
  );


  return result;

}


/* =========================================================
   候補一覧（表示用）

   SIMのみ→そのまま1本
   端末を変える場合→MNP案／機種変更案の
   両方をまとめて金額順に並べる。
   （どちらが得かは最後にまとめて比較して決める）
========================================================= */

function getCandidates() {

  if (state.deviceChoice === "sim") {

    return calculatePlans("sim", null);

  }


  const result = [];

  state.devices.forEach(device => {

    result.push(
      ...calculatePlans("mnp", device)
    );

    result.push(
      ...calculatePlans("change", device)
    );

  });

  return result.sort(
    (a,b) =>
      a.total - b.total
  );

}


/* =========================================================
   候補一覧（Step9用・シナリオ別）

   選ばれた端末すべて分の候補を、
   MNP／機種変更それぞれでまとめて返す。
========================================================= */

function getCandidatesForScenario(
  scenario
) {

  const result = [];

  state.devices.forEach(device => {

    result.push(
      ...calculatePlans(scenario, device)
    );

  });

  return result.sort(
    (a,b) =>
      a.total - b.total
  );

}


/* =========================================================
   CARRIER GROUP
   docomo/ahamo・au/UQ mobile・SoftBank/Y!mobile
   をそれぞれ同一グループとして扱う。
   「その他」やnullは常に別グループ扱い。
========================================================= */

function carrierGroup(
  carrier
) {

  if (
    carrier === "docomo" ||
    carrier === "ahamo"
  ) {

    return "docomo";

  }


  if (
    carrier === "au" ||
    carrier === "UQ mobile"
  ) {

    return "au";

  }


  if (
    carrier === "SoftBank" ||
    carrier === "Y!mobile"
  ) {

    return "softbank";

  }


  return null;

}


/* =========================================================
   SAME CARRIER
========================================================= */

function isSameCarrier(
  planCarrier
) {

  const planGroup =
    carrierGroup(planCarrier);

  const currentGroup =
    carrierGroup(state.currentCarrier);

  return (
    planGroup !== null &&
    planGroup === currentGroup
  );

}


/* =========================================================
   DATA INDEX
========================================================= */

function getPlanIndex(
  plan,
  usage
) {

  for (
    let i = 0;
    i < plan.limits.length;
    i++
  ) {

    if (
      usage <= plan.limits[i]
    ) {

      return i;

    }

  }


  return (
    plan.limits.length - 1
  );

}


/* =========================================================
   CARD DISCOUNT
========================================================= */

function getCardDiscount(
  plan
) {

  if (!plan.cardType) {

    return {
      amount: 0,
      label: null
    };

  }


  const allCards =
    state.currentCards.concat(
      state.newCards
    );


  const type =
    plan.cardType;


  const normalId =
    type === "docomo"
    ? "d"
    : type === "au"
      ? "au"
      : "paypay";


  const goldId =
    type === "docomo"
    ? "dgold"
    : type === "au"
      ? "augold"
      : "paypaygold";


  const hasGold =
    allCards.includes(goldId);


  const hasNormal =
    allCards.includes(normalId);


  if (
    !hasGold &&
    !hasNormal
  ) {

    return {
      amount: 0,
      label: null,
      isNew: false
    };

  }


  /*
   * すでにお持ちのカードかどうか
   * （newCardsだけにある場合は新規発行が必要）
   */

  const goldIsNew =
    hasGold &&
    !state.currentCards.includes(goldId);

  const normalIsNew =
    hasNormal &&
    !state.currentCards.includes(normalId);


  if (
    type === "paypay" &&
    plan.carrier === "Y!mobile"
  ) {

    if (hasGold) {

      return {
        amount:
          plan.cardGoldDiscount || 770,
        label:
          "PayPayカード ゴールド",
        isNew: goldIsNew
      };

    }


    return {
      amount:
        plan.cardDiscount || 330,
      label:
        "PayPayカード",
      isNew: normalIsNew
    };

  }


  if (
    type === "paypay"
  ) {

    if (hasGold) {

      return {
        amount:
          plan.cardGoldDiscount || 550,
        label:
          "PayPayカード ゴールド",
        isNew: goldIsNew
      };

    }


    return {
      amount:
        plan.cardDiscount || 330,
      label:
        "PayPayカード",
      isNew: normalIsNew
    };

  }


  if (
    type === "docomo"
  ) {

    if (hasGold) {

      return {
        amount:
          plan.cardGoldDiscount || 550,
        label:
          "dカード GOLD",
        isNew: goldIsNew
      };

    }

    return {
      amount:
        plan.cardDiscount || 220,
      label:
        "dカード",
      isNew: normalIsNew
    };

  }


  if (
    type === "au"
  ) {

    return {
      amount:
        plan.cardDiscount || 220,
      label:
        hasGold
        ? "au PAY ゴールドカード"
        : "au PAY カード",
      isNew:
        hasGold
        ? goldIsNew
        : normalIsNew
    };

  }


  return {
    amount: 0,
    label: null,
    isNew: false
  };

}


/* =========================================================
   HOME
========================================================= */

function getHomeDiscount(
  plan
) {

  const group =
    carrierGroup(plan.carrier);

  if (
    !group ||
    !plan.homeDiscount
  ) {

    return {
      amount: 0,
      label: null,
      isNew: false
    };

  }


  const alreadyHas =
    state.homeCarrier === group;

  const willingToGet =
    state.newHome === "yes";


  /*
   * auスマートバリューは、
   * 「ネット回線＋固定電話」のセットが原則条件。
   * ネットがない場合はauでんきでも代替判定できる
   * （自宅セット割・でんき／固定電話不要）。
   */

  const auInternetPath =
    group === "au" &&
    (alreadyHas || willingToGet) &&
    state.auHomePhone === "yes";

  const auDenkiPath =
    group === "au" &&
    state.auDenki === "yes";


  if (group === "au") {

    if (!auInternetPath && !auDenkiPath) {

      return {
        amount: 0,
        label: null,
        isNew: false
      };

    }

  } else if (
    !alreadyHas &&
    !willingToGet
  ) {

    return {
      amount: 0,
      label: null,
      isNew: false
    };

  }


  const names = {
    docomo: "ドコモ光セット割",
    au: "auスマートバリュー",
    softbank: "おうち割光セット"
  };

  let label = names[group];

  let isNew = !alreadyHas;


  if (group === "au") {

    label =
      auInternetPath
      ? "auスマートバリュー"
      : "自宅セット割（でんき）";

    isNew =
      auInternetPath && !alreadyHas;

  }


  return {
    amount: plan.homeDiscount,
    label: label,
    isNew: isNew
  };

}


/* =========================================================
   MONEY
========================================================= */

function money(
  number
) {

  return Math.round(
    number
  ).toLocaleString(
    "ja-JP"
  ) + "円";

}


/* =========================================================
   START
========================================================= */

render();

</script>
